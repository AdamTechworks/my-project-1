    <h2>Gallery</h2>
    </header>
    
<!--Carousel Images-->
        <div class="carousel">
                <img src="./images/gogeta-cropped.jpg" alt="Gogeta" class="pic">
                <img src="./images/goku-blue.png" alt="Goku SSGB" class="pic">
                <img src="./images/goku-black-cropped.jpg" alt="Goku Black" class="pic">
                <img src="./images/goku-ssj4.png" alt="Goku SSJ4" class="pic">
                <img src="./images/vegeta.png" alt="Vegeta" class="pic">
                <img src="./images/gohan.png" alt="Gohan" class="pic">      
        </div>  

<!--Gallery Images-->
    <div id="gallery">
        <div class="multi-column-container">
        <section class="gallery-row">
                <input type="checkbox" id="img-pop-up" class="popover-status">
                <label for="img-pop-up" class="popover-trigger">
                    <!-- The original, smaller image -->
                    <img src="./images/gogeta-cropped.jpg" class="thumbnail" width="500" alt="Click to view larger image">
                <span class="popover-content">
                    <!-- The larger, "popped up" image -->
                    <img src="./images/gogeta.png" class="larger" width="1300" height="1100" alt="Larger image view">
                </span>
                </label> 
            <h3>Gogeta</h3>
        </section>

        <section class="gallery-row">
                <input type="checkbox" id="img-pop-up-2" class="popover-status">
                <label for="img-pop-up-2" class="popover-trigger">
                    <!-- The original, smaller image -->
                    <img src="./images/goku-blue.png" class="thumbnail" alt="Click to view larger image">
                <span class="popover-content">
                    <!-- The larger, "popped up" image -->
                    <img src="./images/goku-blue.png" width="1000" height="1090" alt="Larger image view">
                </span>
                </label>
            <h3>Goku SSGB</h3>
        </section>

        <section class="gallery-row">
                <input type="checkbox" id="img-pop-up-3" class="popover-status">
                <label for="img-pop-up-3" class="popover-trigger">
                    <!-- The original, smaller image -->
                    <img src="./images/goku-black-cropped.jpg" class="thumbnail" alt="Click to view larger image">
                <span class="popover-content">
                    <!-- The larger, "popped up" image -->
                    <img src="./images/goku-black.png" class="larger-image" width="800" height="1200" alt="Larger image view">
                </span>
                </label>                 
            <h3>Goku Black</h3>
        </section>

        <section class="gallery-row">
                <input type="checkbox" id="img-pop-up-4" class="popover-status">
                <label for="img-pop-up-4" class="popover-trigger">
                    <!-- The original, smaller image -->
                    <img src="./images/goku-ssj4.png" class="thumbnail" alt="Click to view larger image">
                <span class="popover-content">
                    <!-- The larger, "popped up" image -->
                    <img src="./images/goku-ssj4.png" width="1000" height="1200" alt="Larger image view">
                </span>
                </label>        
            <h3>Goku SS4</h3>
        </section>

        <section class="gallery-row">
                <input type="checkbox" id="img-pop-up-5" class="popover-status">

                </span>
                </label>                 
            <h3>Vegeta Ultra Ego</h3>
        </section>

        <section class="gallery-row">
                <input type="checkbox" id="img-pop-up-6" class="popover-status">
                <label for="img-pop-up-6" class="popover-trigger">
                    <!-- The original, smaller image -->
                    <img src="./images/gohan.png" class="thumbnail" alt="Click to view larger image">
                <span class="popover-content">
                    <!-- The larger, "popped up" image -->
                    <img src="./images/gohan.png" width="950" height="1200" alt="Larger image view">
                </span>
                </label>                 
            <h3>Beast Gohan</h3>
        </section>
