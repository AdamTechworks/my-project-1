<!--Contact Form-->
  <div class="container my-4">
    <div class="row justify-content-center">
      <div class="mt-5 col-12">
        <div class="card border-0 shadow-lg bg-transparent">
          <div class="card-body p-4">
            <h5 class="mt-4 mb-4 text-center">Get in Touch</h5>
              <div class="contact-intro">Collaborations - Commissions - Inquiries</div>

            <form>
              <div class="mb-4 mx-2">
                <label class="form-label">Name</label>
                <input
                  type="text"
                  class="form-control bg-transparent"
                  placeholder="Your name" required>
              </div>

              <div class="mb-4 mx-2">
                <label class="form-label">Email</label>
                <input
                  type="email"
                  class="form-control bg-transparent"
                  placeholder="you@example.com" required>
              </div>

              <div class="mb-4 mx-2">
                <label class="form-label">Message</label>
                <textarea
                  class="form-control bg-transparent"
                  rows="5"
                  placeholder="Your message" required></textarea>
              </div>

            <button type="submit" class="btn btn-primary w-100">
              Send Message
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

    <!-- Background Music (user-controlled) -->
    <audio class="bg-audio" controls loop>
    <source src="./audio/out-of-control.mp3" type="audio/mpeg">
